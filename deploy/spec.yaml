# Snowpark Container Services spec for the FCT Relic inventory dashboard.
#
# The `image` path is /<db>/<schema>/<repo>/<image>:<tag> — the object path of
# your image repository, NOT the full registry hostname. Edit the three
# uppercase segments to match setup.sql if you rename anything.
#
# You can either keep this spec inline in setup.sql (CREATE SERVICE ... FROM
# SPECIFICATION $$...$$) or upload this file to a stage and reference it with
# FROM SPECIFICATION_FILE. See deploy/README.md step 5.
spec:
  containers:
    - name: dashboard
      image: /VAULT_APPS/SPCS/VAULT_REPO/vault-inv-dash:latest
      env:
        # The app calls USE WAREHOUSE <this> on connect. Must match a warehouse
        # the service's owner role can use.
        SNOWFLAKE_WAREHOUSE: ANALYTICS_WAREHOUSE
      readinessProbe:
        # Streamlit's built-in health endpoint. SPCS won't route traffic until
        # this returns 200.
        port: 8501
        path: /_stcore/health
  endpoints:
    - name: app
      port: 8501
      # public: true exposes a Snowflake-authenticated ingress URL (users sign in
      # with their Snowflake login/SSO). Set false for a private, in-account-only
      # endpoint reachable via service-to-service networking.
      public: true
